[project]
name = "planta-api"
version = "0.2.0"
description = "Backend del Sistema de Gestión de Stock y Mantenimiento de Planta"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.18",
    "sqlmodel>=0.0.22",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
